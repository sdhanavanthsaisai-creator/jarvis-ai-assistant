appId: com.jarvis.ai-assistant
productName: JARVIS
copyright: Copyright © 2024 JARVIS Project

directories:
  buildResources: build
  output: release

files:
  - dist
  - dist-electron

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Utility

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JARVIS

publish:
  provider: github
  owner: jarvis-project
  repo: jarvis-desktop
